stages:
  - build
  - test
  - security

variables:
  NODE_VERSION: "24"
  # Jobs test the GitLab checkout of the pushed branch. No automatic sync with GitHub.
  GIT_STRATEGY: fetch
  CI: "true"
  npm_config_cache: "/tmp/.npm"

# Reusable script for npm install with retry logic
# Skips if node_modules already exists (from build artifact)
# Retries up to 3 times with 10s pause to handle NFS/ESTALE errors on Kubernetes runners
.npm_install: &npm_install
  - |
    if [ -d node_modules ] && [ "$(ls -A node_modules 2>/dev/null)" ]; then
      echo "=== Using existing node_modules (from build artifact) ==="
    else
      echo "=== No node_modules found, running npm ci with retry ==="
      npm_install_attempt=1
      npm_install_max=3
      while [ $npm_install_attempt -le $npm_install_max ]; do
        echo "--- npm ci attempt $npm_install_attempt/$npm_install_max ---"
        rm -rf node_modules 2>/dev/null || true
        npm cache clean --force 2>/dev/null || true
        rm -rf /tmp/.npm 2>/dev/null || true
        mkdir -p /tmp/.npm
        if npm ci --no-audit --no-fund; then
          echo "--- npm ci succeeded on attempt $npm_install_attempt ---"
          break
        fi
        echo "--- npm ci failed on attempt $npm_install_attempt ---"
        if [ $npm_install_attempt -lt $npm_install_max ]; then
          echo "Waiting 10s before retry..."
          sleep 10
        fi
        npm_install_attempt=$((npm_install_attempt + 1))
      done
      if [ $npm_install_attempt -gt $npm_install_max ]; then
        echo "=== npm ci failed after $npm_install_max attempts ==="
        exit 1
      fi
    fi

# Reusable script for waiting until PostgreSQL is ready (fixes flaky tests)
.wait_for_postgres: &wait_for_postgres
  - |
    echo "Waiting for PostgreSQL to be ready..."
    for i in $(seq 1 30); do
      if pg_isready -h postgres -p 5432 -U postgres >/dev/null 2>&1; then
        echo "PostgreSQL is ready!"
        break
      fi
      echo "Attempt $i/30: PostgreSQL not ready yet, waiting..."
      sleep 2
    done
    if ! pg_isready -h postgres -p 5432 -U postgres >/dev/null 2>&1; then
      echo "ERROR: PostgreSQL did not become ready in time"
      exit 1
    fi

# Reusable script for waiting until the dev server is ready (fixes flaky e2e tests)
.wait_for_server: &wait_for_server
  - |
    echo "Waiting for dev server to be ready..."
    for i in $(seq 1 60); do
      if curl -s http://localhost:5000 >/dev/null 2>&1; then
        echo "Dev server is ready!"
        break
      fi
      echo "Attempt $i/60: Server not ready yet, waiting..."
      sleep 2
    done
    if ! curl -s http://localhost:5000 >/dev/null 2>&1; then
      echo "ERROR: Dev server did not become ready in time"
      exit 1
    fi

build:
  stage: build
  image: node:${NODE_VERSION}
  retry:
    max: 2
    when:
      - unknown_failure
      - script_failure
      - runner_system_failure
  before_script:
    - apt-get update && apt-get install -y git
  script:
    - *npm_install
    - npm run build
    - rm -rf node_modules
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

typescript-check:
  stage: test
  image: node:${NODE_VERSION}
  dependencies:
    - build
  retry:
    max: 2
    when:
      - unknown_failure
      - script_failure
      - runner_system_failure
  before_script:
    - apt-get update && apt-get install -y git
  script:
    - *npm_install
    - npx tsc --noEmit
  allow_failure: false

validate-translations:
  stage: test
  image: node:${NODE_VERSION}
  dependencies: []
  retry:
    max: 2
    when:
      - unknown_failure
      - runner_system_failure
  before_script:
    - apt-get update && apt-get install -y git
  script:
    - node scripts/validate-translations.cjs
  allow_failure: false

unit-tests:
  stage: test
  image: node:${NODE_VERSION}
  dependencies:
    - build
  retry:
    max: 2
    when:
      - unknown_failure
      - script_failure
      - runner_system_failure
  before_script:
    - apt-get update && apt-get install -y git postgresql-client chromium fonts-liberation
  services:
    - postgres:15
  variables:
    PUPPETEER_SKIP_DOWNLOAD: "true"
    PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
    POSTGRES_DB: polly_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/polly_test"
    TEST_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/polly_test_isolated"
    SMTP_ENABLED: "false"
    SESSION_SECRET: "test-session-secret-minimum-32-characters-long"
  script:
    - *npm_install
    - *wait_for_postgres
    - psql "postgresql://postgres:postgres@postgres:5432/postgres" -c "CREATE DATABASE polly_test_isolated" || true
    - DATABASE_URL="$TEST_DATABASE_URL" npm run db:push
    - npx vitest run --reporter=verbose --reporter=junit --outputFile=test-results.xml
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    expire_in: 1 week

