name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  CI: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Validate Translations
        run: node scripts/validate-translations.cjs

      - name: Public response privacy tests (no database)
        run: npx vitest run --config vitest.privacy.config.ts

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: polly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/polly_test
        run: npm run db:push

      # One run covers both gates: any failing test OR a coverage value below
      # the thresholds in vitest.config.ts fails this step (and the pipeline).
      # Vitest prints "Coverage for <metric> (x%) does not meet global threshold"
      # when the coverage gate is the cause.
      - name: Run tests with coverage gate
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/polly_test
          NODE_ENV: test
        run: npx vitest run --coverage --reporter=verbose

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        # Upload even when the gate failed so the report shows where coverage dropped.
        if: ${{ !cancelled() }}
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  pdf-sandbox:
    name: Sandboxed PDF Export (Linux Container)
    runs-on: ubuntu-24.04
    # This isolated test container permits Chromium's user-namespace setup.
    # The relaxed outer profiles do not affect the application's production container.
    container:
      image: node:24-bookworm
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: polly_pdf_sandbox_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          apt-get update
          apt-get install -y --no-install-recommends chromium chromium-sandbox

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://test:test@postgres:5432/polly_pdf_sandbox_test
        run: npm run db:push

      - name: Render PDF with Chromium sandbox enabled
        env:
          TEST_DATABASE_URL: postgresql://test:test@postgres:5432/polly_pdf_sandbox_test
          NODE_ENV: test
          PDF_CHROMIUM_SANDBOX: 'true'
          PDF_CHROMIUM_SANDBOX_SMOKE: 'true'
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
        run: |
          chown -R node:node "$GITHUB_WORKSPACE"
          runuser --preserve-environment --user node -- \
            env HOME=/home/node ./node_modules/.bin/vitest run server/tests/services/pdfService.test.ts \
            -t "renders a valid PDF with Chromium sandbox enabled"

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: build
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref_name == 'main')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: polly_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U test; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... attempt $i"
            sleep 2
          done

      - name: Setup database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/polly_e2e
        run: |
          npm run db:push
          echo "Database schema pushed successfully"

      - name: Verify database connection
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/polly_e2e
        run: |
          PGPASSWORD=test psql -h localhost -U test -d polly_e2e -c "SELECT 1 as connection_test;"
          echo "Database connection verified"

      - name: Build application
        run: npm run build

      - name: Generate per-run test-mode secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "TEST_MODE_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/polly_e2e
          NODE_ENV: production
          SESSION_SECRET: e2e-test-session-secret-minimum-32-characters-long
          BASE_URL: http://localhost:5000
          SMTP_ENABLED: false
          ENABLE_TEST_MODE: 'true'
        run: npx playwright test --timeout=60000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true

      - name: Check for known vulnerabilities
        run: npx better-npm-audit audit || true
