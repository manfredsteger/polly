e2e-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.57.0-noble
  dependencies:
    - build
  retry:
    max: 2
    when:
      - unknown_failure
      - script_failure
      - runner_system_failure
  before_script:
    - apt-get update && apt-get install -y git postgresql-client curl
    - mkdir -p playwright-report test-results
  services:
    - postgres:15
  variables:
    POSTGRES_DB: polly_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/polly_test"
    SESSION_SECRET: "e2e-test-session-secret-minimum-32-characters-long"
    BASE_URL: "http://localhost:5000"
    SMTP_ENABLED: "false"
    NODE_ENV: "test"
    ENABLE_TEST_MODE: "true"
    npm_config_cache: "/tmp/.npm"
  script:
    - *npm_install
    - *wait_for_postgres
    - npm run db:push
    # Fresh random test-mode secret per run; Playwright starts the dev server (webServer) and passes it on.
    - export TEST_MODE_SECRET="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
    - npx playwright test --reporter=list --timeout=60000
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week
  allow_failure: false

security-audit:
  stage: security
  image: node:${NODE_VERSION}
  dependencies:
    - build
  retry:
    max: 2
    when:
      - unknown_failure
      - script_failure
      - runner_system_failure
  before_script:
    - apt-get update && apt-get install -y git
  script:
    - *npm_install
    - npm audit --audit-level=high || true
  allow_failure: true
