<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #475569;
        --accent: #f97316;
        --card: #ffffff;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --fg: #f1f5f9;
          --muted: #94a3b8;
          --card: #1e293b;
          --border: #334155;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--accent);
        color: white;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 1rem;
      }
      h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
      p { margin: 0 0 1.25rem; color: var(--muted); line-height: 1.5; }
      button {
        background: var(--accent);
        color: white;
        border: 0;
        padding: .65rem 1.25rem;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button:hover { filter: brightness(0.95); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">⚡</div>
      <h1>You are offline</h1>
      <p>This app needs an internet connection to load polls and submit votes. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
